<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>牌組編輯｜602ZR</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family:
                Arial,
                "Noto Sans TC",
                "Microsoft JhengHei",
                sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            background: #f5f6f8;
        }


        /* =============================== */
        /* 上方導覽列 */
        /* =============================== */

        header {

            height: 64px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 24px;

            background: white;

            border-bottom: 1px solid #ddd;

        }


        .logo {

            font-size: 25px;

            font-weight: 800;

            color: #111;

            text-decoration: none;

        }


        .page-title {

            font-size: 15px;

            color: #666;

        }


        .back-button {

            padding: 8px 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            background: white;

            color: #222;

            text-decoration: none;

            font-size: 14px;

        }


        .back-button:hover {

            background: #f3f3f3;

        }


        /* =============================== */
        /* GAS 牌組編輯器 */
        /* =============================== */

        main {

            flex: 1;

            width: 100%;

            min-height: 0;

        }


        #deck-frame {

            display: block;

            width: 100%;

            height: 100%;

            border: none;

            background: white;

        }


        /* =============================== */
        /* 手機 */
        /* =============================== */

        @media (max-width: 600px) {

            header {

                height: 58px;

                padding: 0 14px;

            }


            .logo {

                font-size: 22px;

            }


            .page-title {

                display: none;

            }

        }

    </style>

</head>


<body>


<header>

    <a
        href="../"
        class="logo"
    >
        602ZR
    </a>


    <div class="page-title">
        牌組編輯
    </div>


    <a
        href="../"
        class="back-button"
    >
        返回首頁
    </a>

</header>



<main>

    <iframe
        id="deck-frame"
        src="https://script.google.com/macros/s/AKfycbyk1wnkT18zDbSucOUtTTfK7_qN4eOOLWZ518ljOC6dl0oUKC4eNwpFxTrYh9hucT_t/exec"
        title="602ZR 牌組編輯器"
        allow="geolocation; microphone; camera"
    >
    </iframe>

</main>


</body>

</html>
