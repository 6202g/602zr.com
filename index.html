<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>602ZR</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                Arial,
                "Noto Sans TC",
                "Microsoft JhengHei",
                sans-serif;

            background: #f5f6f8;

            color: #222;

        }


        /* ===================================== */
        /* 頂部導覽列 */
        /* ===================================== */

        header {

            width: 100%;

            min-height: 76px;

            background: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 12px 36px;

            border-bottom: 1px solid #e2e2e2;

            position: sticky;

            top: 0;

            z-index: 100;

        }


        /* ===================================== */
        /* Logo */
        /* ===================================== */

        .logo {

            font-size: 30px;

            font-weight: 800;

            letter-spacing: 1px;

            color: #111;

            text-decoration: none;

        }


        .logo:hover {

            opacity: 0.75;

        }


        /* ===================================== */
        /* Google 登入區 */
        /* ===================================== */

        #auth-area {

            display: flex;

            align-items: center;

            justify-content: flex-end;

            min-height: 44px;

        }


        .google-not-configured {

            font-size: 13px;

            color: #777;

            background: #f2f2f2;

            padding: 9px 14px;

            border-radius: 20px;

        }


        /* ===================================== */
        /* 登入後帳號 */
        /* ===================================== */

        .account-box {

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .account-avatar {

            width: 42px;

            height: 42px;

            border-radius: 50%;

            object-fit: cover;

            border: 1px solid #ddd;

        }


        .account-info {

            display: flex;

            flex-direction: column;

            line-height: 1.25;

        }


        .account-name {

            font-size: 14px;

            font-weight: 700;

        }


        .account-email {

            font-size: 11px;

            color: #777;

            margin-top: 2px;

        }


        .logout-button {

            border: 1px solid #ccc;

            background: white;

            color: #333;

            padding: 7px 12px;

            border-radius: 8px;

            cursor: pointer;

            margin-left: 4px;

        }


        .logout-button:hover {

            background: #f4f4f4;

        }


        /* ===================================== */
        /* 主內容 */
        /* ===================================== */

        main {

            max-width: 1050px;

            margin: 0 auto;

            padding: 65px 25px 80px;

        }


        .hero {

            margin-bottom: 45px;

        }


        .hero h1 {

            margin: 0;

            font-size: 48px;

            font-weight: 800;

            letter-spacing: 1px;

        }


        .hero p {

            margin-top: 10px;

            margin-bottom: 0;

            color: #777;

            font-size: 16px;

        }


        /* ===================================== */
        /* 功能連結 */
        /* ===================================== */

        #home-links {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(260px, 1fr)
                );

            gap: 20px;

        }


        .menu-card {

            display: block;

            min-height: 135px;

            background: white;

            padding: 27px;

            border-radius: 16px;

            color: #222;

            text-decoration: none;

            border: 1px solid #e1e1e1;

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                border-color 0.18s ease;

        }


        .menu-card:hover {

            transform: translateY(-4px);

            border-color: #ccc;

            box-shadow:
                0 12px 30px
                rgba(0, 0, 0, 0.08);

        }


        .menu-title {

            font-size: 21px;

            font-weight: 700;

            margin-bottom: 10px;

        }


        .menu-description {

            font-size: 14px;

            line-height: 1.6;

            color: #777;

        }


        /* ===================================== */
        /* Footer */
        /* ===================================== */

        footer {

            text-align: center;

            padding: 30px 20px;

            color: #999;

            font-size: 12px;

        }


        /* ===================================== */
        /* 平板 / 手機 */
        /* ===================================== */

        @media (max-width: 700px) {

            header {

                padding: 10px 16px;

            }


            .logo {

                font-size: 25px;

            }


            main {

                padding:
                    45px
                    18px
                    60px;

            }


            .hero h1 {

                font-size: 38px;

            }


            .account-email {

                display: none;

            }

        }


        @media (max-width: 500px) {

            header {

                align-items: center;

            }


            .account-info {

                display: none;

            }


            .logout-button {

                font-size: 12px;

                padding: 6px 9px;

            }


            #home-links {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


<!-- ===================================== -->
<!-- 頂部 -->
<!-- ===================================== -->

<header>

    <a
        href="./"
        class="logo"
        data-home-link
    >
        602ZR
    </a>


    <div id="auth-area">

        <!--
            app.js 會自動在這裡顯示：

            Google 登入按鈕

            或

            Google 頭像
            使用者名稱
            Email
            登出
        -->

    </div>

</header>



<!-- ===================================== -->
<!-- 主畫面 -->
<!-- ===================================== -->

<main>


    <section class="hero">

        <h1>
            602ZR
        </h1>

        <p>
            Pokémon Trading Card Game Platform
        </p>

    </section>



    <!-- ================================= -->
    <!-- 功能選單 -->
    <!-- app.js 自動建立 -->
    <!-- ================================= -->

    <section id="home-links">

        <!--

        app.js 會自動產生：

        對戰模擬
        牌組編輯
        PTCG 訓練家網站臺灣
        最新賽事
        聊天平台

        -->

    </section>


</main>



<footer>

    602ZR

</footer>



<!-- ===================================== -->
<!-- Google Identity Services -->
<!-- ===================================== -->

<script
    src="https://accounts.google.com/gsi/client"
    async
    defer>
</script>



<!-- ===================================== -->
<!-- 602ZR JavaScript -->
<!-- ===================================== -->

<script src="./app.js"></script>


</body>

</html>
