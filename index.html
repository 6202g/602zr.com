<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>602ZR</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

    background: #f5f6f8;

    color: #222;

}


/* ============================= */
/* Header */
/* ============================= */

header {

    min-height: 76px;

    background: white;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 12px 36px;

    border-bottom: 1px solid #ddd;

}


.logo {

    font-size: 30px;

    font-weight: 800;

    color: #111;

    text-decoration: none;

}


/* ============================= */
/* Login area */
/* ============================= */

#auth-area {

    display: flex;

    align-items: center;

    gap: 10px;

}


.auth-button {

    padding: 9px 16px;

    border-radius: 9px;

    border: 1px solid #ccc;

    background: white;

    cursor: pointer;

    font-size: 14px;

}


.auth-button.primary {

    background: #111;

    color: white;

    border-color: #111;

}


.auth-button:hover {

    opacity: .8;

}


.user-box {

    display: flex;

    align-items: center;

    gap: 12px;

}


.user-name {

    font-weight: 700;

}


.user-email {

    color: #888;

    font-size: 11px;

}


/* ============================= */
/* Main */
/* ============================= */

main {

    max-width: 1050px;

    margin: auto;

    padding: 65px 25px 80px;

}


.hero {

    margin-bottom: 45px;

}


.hero h1 {

    font-size: 48px;

    margin: 0;

}


.hero p {

    color: #777;

    margin-top: 10px;

}


/* ============================= */
/* Menu */
/* ============================= */

#home-links {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(260px, 1fr)
        );

    gap: 20px;

}


.menu-card {

    display: block;

    min-height: 135px;

    background: white;

    padding: 27px;

    border-radius: 16px;

    text-decoration: none;

    color: #222;

    border: 1px solid #ddd;

    transition: .2s;

}


.menu-card:hover {

    transform: translateY(-4px);

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.08);

}


.menu-title {

    font-size: 21px;

    font-weight: 700;

    margin-bottom: 10px;

}


.menu-description {

    color: #777;

    font-size: 14px;

    line-height: 1.6;

}


/* ============================= */
/* Modal */
/* ============================= */

.modal {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.35);

    display: flex;

    align-items: center;

    justify-content: center;

    z-index: 999;

    padding: 20px;

}


.hidden {

    display: none !important;

}


.modal-card {

    width: 100%;

    max-width: 420px;

    background: white;

    border-radius: 18px;

    padding: 28px;

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.2);

}


.modal-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 20px;

}


.modal-title {

    font-size: 24px;

    font-weight: 800;

}


.close-button {

    border: 0;

    background: transparent;

    font-size: 26px;

    cursor: pointer;

}


/* Tabs */

.tabs {

    display: flex;

    gap: 8px;

    margin-bottom: 24px;

}


.tab {

    flex: 1;

    padding: 10px;

    border-radius: 9px;

    border: 1px solid #ddd;

    background: white;

    cursor: pointer;

}


.tab.active {

    background: #111;

    color: white;

}


/* Form */

.form-group {

    margin-bottom: 16px;

}


.form-label {

    display: block;

    font-weight: 600;

    margin-bottom: 7px;

}


.form-input {

    width: 100%;

    padding: 12px 13px;

    border-radius: 9px;

    border: 1px solid #ccc;

    font-size: 16px;

}


.form-button {

    width: 100%;

    padding: 12px;

    border: 0;

    border-radius: 9px;

    background: #111;

    color: white;

    cursor: pointer;

    font-size: 15px;

}


.form-button.secondary {

    margin-top: 8px;

    background: #eee;

    color: #222;

}


.form-button:disabled {

    opacity: .5;

    cursor: not-allowed;

}


.form-status {

    margin-top: 15px;

    min-height: 20px;

    font-size: 14px;

}


.form-status.error {

    color: #b00020;

}


.form-status.success {

    color: #087f23;

}


.account-preview {

    background: #f4f5f7;

    border-radius: 10px;

    padding: 11px;

    margin-bottom: 16px;

    font-size: 13px;

}


footer {

    text-align: center;

    padding: 25px;

    color: #aaa;

    font-size: 12px;

}


@media (max-width: 600px) {

    header {

        padding: 10px 16px;

    }

    .logo {

        font-size: 25px;

    }

    main {

        padding: 45px 18px;

    }

    .hero h1 {

        font-size: 38px;

    }

    .user-email {

        display: none;

    }

}

</style>

</head>


<body>


<header>

<a
    class="logo"
    href="./"
>
602ZR
</a>


<div id="auth-area">

<!-- app.js 自動產生 -->

</div>

</header>



<main>

<section class="hero">

<h1>
602ZR
</h1>

<p>
Pokémon Trading Card Game Platform
</p>

</section>


<section id="home-links"></section>

</main>



<footer>
602ZR
</footer>



<!-- ============================== -->
<!-- 會員登入視窗 -->
<!-- ============================== -->

<div
    id="auth-modal"
    class="modal hidden"
>

<div class="modal-card">


<div class="modal-header">

<div class="modal-title">
602ZR 帳號
</div>

<button
    id="close-auth"
    class="close-button"
>
×
</button>

</div>



<div class="tabs">

<button
    id="login-tab"
    class="tab active"
>
登入
</button>

<button
    id="register-tab"
    class="tab"
>
註冊
</button>

</div>



<!-- ============================== -->
<!-- 登入 -->
<!-- ============================== -->

<div id="login-panel">


<!-- Login Step 1 -->

<div id="login-step-1">

<div class="form-group">

<label class="form-label">
帳號
</label>

<input
    id="login-username"
    class="form-input"
    type="text"
    autocomplete="username"
    placeholder="輸入 602ZR 帳號"
>

</div>


<button
    id="login-check-account"
    class="form-button"
>
下一步
</button>

</div>



<!-- Login Step 2 -->

<div
    id="login-step-2"
    class="hidden"
>

<div
    id="login-account-preview"
    class="account-preview"
></div>


<div class="form-group">

<label class="form-label">
密碼
</label>

<input
    id="login-password"
    class="form-input"
    type="password"
    autocomplete="current-password"
    placeholder="輸入密碼"
>

</div>


<button
    id="login-submit"
    class="form-button"
>
登入
</button>


<button
    id="login-back"
    class="form-button secondary"
>
返回
</button>

</div>


<div
    id="login-status"
    class="form-status"
></div>

</div>



<!-- ============================== -->
<!-- 註冊 -->
<!-- ============================== -->

<div
    id="register-panel"
    class="hidden"
>


<!-- Register Step 1 -->

<div id="register-step-1">

<div class="form-group">

<label class="form-label">
Email
</label>

<input
    id="register-email"
    class="form-input"
    type="email"
    autocomplete="email"
    placeholder="name@example.com"
>

</div>


<button
    id="register-check-email"
    class="form-button"
>
檢查 Email
</button>

</div>



<!-- Register Step 2 -->

<div
    id="register-step-2"
    class="hidden"
>


<div
    id="register-email-preview"
    class="account-preview"
></div>


<div class="form-group">

<label class="form-label">
自訂帳號
</label>

<input
    id="register-username"
    class="form-input"
    type="text"
    autocomplete="username"
    placeholder="例如 602ZRPlayer"
>

</div>


<div class="form-group">

<label class="form-label">
密碼
</label>

<input
    id="register-password"
    class="form-input"
    type="password"
    autocomplete="new-password"
    placeholder="至少 8 個字元"
>

</div>


<div class="form-group">

<label class="form-label">
再次輸入密碼
</label>

<input
    id="register-password-confirm"
    class="form-input"
    type="password"
    autocomplete="new-password"
    placeholder="再次輸入密碼"
>

</div>


<button
    id="register-submit"
    class="form-button"
>
建立帳號
</button>


<button
    id="register-back"
    class="form-button secondary"
>
返回
</button>

</div>


<div
    id="register-status"
    class="form-status"
></div>

</div>


</div>

</div>



<script src="./app.js"></script>

</body>

</html>
