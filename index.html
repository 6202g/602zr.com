<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>602ZR</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;

            font-family:
                Arial,
                "Noto Sans TC",
                "Microsoft JhengHei",
                sans-serif;

            background: #f5f6f8;
            color: #222;
        }


        /* ======================================== */
        /* Header */
        /* ======================================== */

        header {

            min-height: 76px;

            padding: 12px 36px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: white;

            border-bottom: 1px solid #e5e5e5;

            position: sticky;
            top: 0;

            z-index: 100;

        }


        .logo {

            color: #111;

            text-decoration: none;

            font-size: 30px;

            font-weight: 800;

            letter-spacing: 1px;

        }


        /* ======================================== */
        /* Login Area */
        /* ======================================== */

        #auth-area {

            display: flex;

            align-items: center;

            justify-content: flex-end;

            gap: 9px;

            min-height: 44px;

        }


        .auth-button {

            border: 1px solid #d0d0d0;

            background: white;

            color: #222;

            border-radius: 9px;

            padding: 9px 16px;

            font-size: 14px;

            cursor: pointer;

            transition:
                background .15s,
                opacity .15s;

        }


        .auth-button:hover {

            background: #f5f5f5;

        }


        .auth-button.primary {

            background: #111;

            color: white;

            border-color: #111;

        }


        .auth-button.primary:hover {

            opacity: .85;

        }


        .user-box {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .user-info {

            text-align: right;

            line-height: 1.3;

        }


        .user-name {

            font-size: 14px;

            font-weight: 700;

        }


        .user-email {

            margin-top: 2px;

            color: #888;

            font-size: 11px;

        }


        /* ======================================== */
        /* Main */
        /* ======================================== */

        main {

            width: 100%;

            max-width: 1050px;

            margin: 0 auto;

            padding: 65px 25px 80px;

        }


        .hero {

            margin-bottom: 45px;

        }


        .hero h1 {

            margin: 0;

            font-size: 48px;

            font-weight: 800;

            letter-spacing: 1px;

        }


        .hero p {

            margin-top: 10px;

            margin-bottom: 0;

            color: #777;

            font-size: 16px;

        }


        /* ======================================== */
        /* Menu Cards */
        /* ======================================== */

        #home-links {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(260px, 1fr)
                );

            gap: 20px;

        }


        .menu-card {

            display: block;

            min-height: 135px;

            padding: 27px;

            color: #222;

            background: white;

            text-decoration: none;

            border: 1px solid #e1e1e1;

            border-radius: 16px;

            transition:
                transform .18s ease,
                box-shadow .18s ease,
                border-color .18s ease;

        }


        .menu-card:hover {

            transform: translateY(-4px);

            border-color: #cfcfcf;

            box-shadow:
                0 12px 30px
                rgba(0, 0, 0, .08);

        }


        .menu-title {

            margin-bottom: 10px;

            font-size: 21px;

            font-weight: 700;

        }


        .menu-description {

            color: #777;

            font-size: 14px;

            line-height: 1.6;

        }


        /* ======================================== */
        /* Modal */
        /* ======================================== */

        .modal {

            position: fixed;

            inset: 0;

            z-index: 1000;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(0, 0, 0, .42);

        }


        .hidden {

            display: none !important;

        }


        .modal-card {

            width: 100%;

            max-width: 430px;

            max-height: 90vh;

            overflow-y: auto;

            padding: 28px;

            background: white;

            border-radius: 18px;

            box-shadow:
                0 24px 80px
                rgba(0, 0, 0, .24);

        }


        .modal-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 20px;

        }


        .modal-title {

            font-size: 24px;

            font-weight: 800;

        }


        .close-button {

            width: 36px;

            height: 36px;

            padding: 0;

            border: 0;

            background: transparent;

            color: #444;

            font-size: 28px;

            cursor: pointer;

        }


        /* ======================================== */
        /* Tabs */
        /* ======================================== */

        .tabs {

            display: flex;

            gap: 8px;

            margin-bottom: 24px;

        }


        .tab {

            flex: 1;

            padding: 10px;

            border: 1px solid #ddd;

            border-radius: 9px;

            background: white;

            color: #222;

            cursor: pointer;

        }


        .tab.active {

            color: white;

            background: #111;

            border-color: #111;

        }


        /* ======================================== */
        /* Forms */
        /* ======================================== */

        .form-group {

            margin-bottom: 16px;

        }


        .form-label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 600;

        }


        .form-input {

            width: 100%;

            padding: 12px 13px;

            border: 1px solid #ccc;

            border-radius: 9px;

            background: white;

            color: #222;

            font-size: 16px;

            outline: none;

        }


        .form-input:focus {

            border-color: #777;

            box-shadow:
                0 0 0 3px
                rgba(0, 0, 0, .05);

        }


        .form-button {

            width: 100%;

            padding: 12px;

            border: 0;

            border-radius: 9px;

            background: #111;

            color: white;

            font-size: 15px;

            cursor: pointer;

        }


        .form-button:hover {

            opacity: .88;

        }


        .form-button.secondary {

            margin-top: 8px;

            background: #eee;

            color: #222;

        }


        .form-button:disabled {

            opacity: .5;

            cursor: not-allowed;

        }


        .form-status {

            min-height: 22px;

            margin-top: 15px;

            font-size: 14px;

            line-height: 1.5;

        }


        .form-status.error {

            color: #b00020;

        }


        .form-status.success {

            color: #087f23;

        }


        .account-preview {

            margin-bottom: 16px;

            padding: 11px 13px;

            background: #f4f5f7;

            border-radius: 10px;

            color: #444;

            font-size: 13px;

            line-height: 1.5;

        }


        .code-help {

            margin-top: 9px;

            color: #888;

            font-size: 12px;

            line-height: 1.5;

        }


        #register-code {

            text-align: center;

            letter-spacing: 7px;

            font-size: 22px;

            font-weight: 700;

        }


        /* ======================================== */
        /* Footer */
        /* ======================================== */

        footer {

            padding: 30px 20px;

            color: #999;

            text-align: center;

            font-size: 12px;

        }


        /* ======================================== */
        /* Mobile */
        /* ======================================== */

        @media (max-width: 700px) {

            header {

                padding: 10px 16px;

            }


            .logo {

                font-size: 25px;

            }


            main {

                padding:
                    45px
                    18px
                    60px;

            }


            .hero h1 {

                font-size: 38px;

            }


            .user-email {

                display: none;

            }

        }


        @media (max-width: 500px) {

            #home-links {

                grid-template-columns: 1fr;

            }


            .user-info {

                display: none;

            }


            .auth-button {

                padding: 8px 11px;

            }


            .modal-card {

                padding: 22px;

            }

        }

    </style>

</head>


<body>


<header>

    <a
        href="./"
        class="logo"
    >
        602ZR
    </a>


    <div id="auth-area">

        <!-- app.js 會自動建立登入／註冊按鈕 -->

    </div>

</header>



<main>


    <section class="hero">

        <h1>
            602ZR
        </h1>

        <p>
            Pokémon Trading Card Game Platform
        </p>

    </section>


    <section id="home-links">

        <!-- app.js 自動建立 -->

    </section>


</main>



<footer>
    602ZR
</footer>



<!-- ================================================== -->
<!-- Account Modal -->
<!-- ================================================== -->

<div
    id="auth-modal"
    class="modal hidden"
>


    <div class="modal-card">


        <div class="modal-header">

            <div class="modal-title">
                602ZR 帳號
            </div>


            <button
                id="close-auth"
                class="close-button"
                type="button"
                aria-label="關閉"
            >
                ×
            </button>

        </div>



        <!-- Tabs -->

        <div class="tabs">

            <button
                id="login-tab"
                class="tab active"
                type="button"
            >
                登入
            </button>


            <button
                id="register-tab"
                class="tab"
                type="button"
            >
                註冊
            </button>

        </div>



        <!-- ================================================== -->
        <!-- Login -->
        <!-- ================================================== -->

        <div id="login-panel">


            <!-- Login Step 1 -->

            <div id="login-step-1">

                <div class="form-group">

                    <label
                        for="login-username"
                        class="form-label"
                    >
                        帳號
                    </label>


                    <input
                        id="login-username"
                        class="form-input"
                        type="text"
                        autocomplete="username"
                        maxlength="24"
                        placeholder="輸入 602ZR 帳號"
                    >

                </div>


                <button
                    id="login-check-account"
                    class="form-button"
                    type="button"
                >
                    下一步
                </button>

            </div>



            <!-- Login Step 2 -->

            <div
                id="login-step-2"
                class="hidden"
            >

                <div
                    id="login-account-preview"
                    class="account-preview"
                ></div>


                <div class="form-group">

                    <label
                        for="login-password"
                        class="form-label"
                    >
                        密碼
                    </label>


                    <input
                        id="login-password"
                        class="form-input"
                        type="password"
                        autocomplete="current-password"
                        maxlength="128"
                        placeholder="輸入密碼"
                    >

                </div>


                <button
                    id="login-submit"
                    class="form-button"
                    type="button"
                >
                    登入
                </button>


                <button
                    id="login-back"
                    class="form-button secondary"
                    type="button"
                >
                    返回
                </button>

            </div>


            <div
                id="login-status"
                class="form-status"
            ></div>


        </div>



        <!-- ================================================== -->
        <!-- Register -->
        <!-- ================================================== -->

        <div
            id="register-panel"
            class="hidden"
        >


            <!-- Step 1：Email -->

            <div id="register-step-1">


                <div class="form-group">

                    <label
                        for="register-email"
                        class="form-label"
                    >
                        Email
                    </label>


                    <input
                        id="register-email"
                        class="form-input"
                        type="email"
                        autocomplete="email"
                        maxlength="200"
                        placeholder="name@example.com"
                    >

                </div>


                <button
                    id="register-send-code"
                    class="form-button"
                    type="button"
                >
                    寄送 6 位數驗證碼
                </button>


                <div class="code-help">
                    驗證碼會寄到這個 Email。
                    驗證成功後才能設定 602ZR 帳號與密碼。
                </div>

            </div>



            <!-- Step 2：Email Code -->

            <div
                id="register-step-2"
                class="hidden"
            >


                <div
                    id="register-email-code-preview"
                    class="account-preview"
                ></div>


                <div class="form-group">

                    <label
                        for="register-code"
                        class="form-label"
                    >
                        6 位數 Email 驗證碼
                    </label>


                    <input
                        id="register-code"
                        class="form-input"
                        type="text"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        maxlength="6"
                        pattern="[0-9]*"
                        placeholder="000000"
                    >

                </div>


                <button
                    id="register-verify-code"
                    class="form-button"
                    type="button"
                >
                    驗證
                </button>


                <button
                    id="register-resend-code"
                    class="form-button secondary"
                    type="button"
                >
                    重新寄送驗證碼
                </button>


                <button
                    id="register-back-email"
                    class="form-button secondary"
                    type="button"
                >
                    修改 Email
                </button>


                <div class="code-help">
                    驗證碼有效時間為 10 分鐘。
                </div>

            </div>



            <!-- Step 3：Username + Password -->

            <div
                id="register-step-3"
                class="hidden"
            >


                <div
                    id="register-email-preview"
                    class="account-preview"
                ></div>


                <div class="form-group">

                    <label
                        for="register-username"
                        class="form-label"
                    >
                        自訂帳號
                    </label>


                    <input
                        id="register-username"
                        class="form-input"
                        type="text"
                        autocomplete="username"
                        maxlength="24"
                        placeholder="例如 602ZRPlayer"
                    >

                </div>


                <div class="code-help">
                    帳號可使用 3–24 個英文字母、數字或底線。
                </div>


                <br>


                <div class="form-group">

                    <label
                        for="register-password"
                        class="form-label"
                    >
                        密碼
                    </label>


                    <input
                        id="register-password"
                        class="form-input"
                        type="password"
                        autocomplete="new-password"
                        maxlength="128"
                        placeholder="至少 8 個字元"
                    >

                </div>


                <div class="form-group">

                    <label
                        for="register-password-confirm"
                        class="form-label"
                    >
                        再次輸入密碼
                    </label>


                    <input
                        id="register-password-confirm"
                        class="form-input"
                        type="password"
                        autocomplete="new-password"
                        maxlength="128"
                        placeholder="再次輸入密碼"
                    >

                </div>


                <button
                    id="register-submit"
                    class="form-button"
                    type="button"
                >
                    建立帳號
                </button>


            </div>


            <div
                id="register-status"
                class="form-status"
            ></div>


        </div>


    </div>


</div>



<script src="./app.js"></script>


</body>

</html>
